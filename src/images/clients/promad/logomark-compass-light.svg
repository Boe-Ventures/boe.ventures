<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 8 40 40" fill="none">
  <!-- Compass circle -->
  <circle cx="32" cy="28" r="18" stroke="#ffffff" stroke-width="3" fill="none"/>
  <!-- Compass needle north (white) -->
  <polygon points="32,14 28.5,28 35.5,28" fill="#ffffff"/>
  <!-- Compass needle south (muted) -->
  <polygon points="32,42 28.5,28 35.5,28" fill="#737373"/>
